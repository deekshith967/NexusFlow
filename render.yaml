# Render Blueprint for NexusFlow (see README "Deploying to Render").
#
# Provisions managed PostgreSQL plus one service per NexusFlow role.
# Kafka is NOT provisioned here (Render has no managed Kafka): set
# KAFKA_BOOTSTRAP_SERVERS in the dashboard to an external broker
# (e.g. Upstash, Confluent Cloud, Redpanda Cloud) before deploying.
#
# Plans: only the web service and the database can use the Free plan.
# Background workers have NO free tier, so scheduler/worker/relay use
# 0.5c-512mb (the cheapest valid worker plan). The free web service
# sleeps after 15 minutes without traffic; use paid plans for
# always-on production roles. The free database expires 30 days after
# creation (see README).
#
# TLS: DATABASE_URL (fromDatabase connectionString) injects Render's
# INTERNAL database URL, which uses the private network where TLS is
# optional. DATABASE_SSL is deliberately NOT set here: forcing TLS
# crashes every service at boot when the server does not offer TLS
# (the pg client fails closed with "The server does not support SSL
# connections" instead of falling back to plaintext). TLS stays
# available for external/TLS-mandating endpoints via DATABASE_SSL=true
# or ?sslmode=require (see README).

services:
  - type: web
    name: nexusflow-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # Migrations run ONCE per deploy, from the api service only. Do not
    # copy this to the other services: concurrent migrates are not
    # coordinated and would fail the deploy.
    preDeployCommand: npm run migrate:prod
    startCommand: node dist/main.js
    # No maxShutdownDelaySeconds: the stateless API needs no drain
    # beyond the default 30s grace.
    healthCheckPath: /health/ready
    envVars:
      - key: NEXUSFLOW_ROLE
        value: api
      - key: NEXUSFLOW_TRANSPORT
        value: kafka
      - key: DATABASE_URL
        fromDatabase:
          name: nexusflow-db
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: NEXUSFLOW_DISPATCH_TOPIC
        value: nexusflow.task.dispatch
      - key: NEXUSFLOW_LIFECYCLE_TOPIC
        value: nexusflow.workflow.events
      - key: NEXUSFLOW_WORKER_GROUP
        value: nexusflow-workers

  - type: worker
    name: nexusflow-scheduler
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: node dist/main.js
    # No maxShutdownDelaySeconds: shutdown only clears the poll timer
    # (default 30s grace); unclaimed work is recovered via leases.
    envVars:
      - key: NEXUSFLOW_ROLE
        value: scheduler
      - key: NEXUSFLOW_TRANSPORT
        value: kafka
      - key: DATABASE_URL
        fromDatabase:
          name: nexusflow-db
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: NEXUSFLOW_DISPATCH_TOPIC
        value: nexusflow.task.dispatch
      - key: NEXUSFLOW_LIFECYCLE_TOPIC
        value: nexusflow.workflow.events
      - key: NEXUSFLOW_WORKER_GROUP
        value: nexusflow-workers

  - type: worker
    name: nexusflow-worker
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: node dist/main.js
    # Shutdown headroom for consumer leave-group/disconnect plus
    # in-flight completion writes. In-flight handlers are NOT awaited
    # (lease expiry reclaims them either way), so 60s is headroom, not
    # a drain requirement. Max 300.
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NEXUSFLOW_ROLE
        value: worker
      - key: NEXUSFLOW_TRANSPORT
        value: kafka
      - key: DATABASE_URL
        fromDatabase:
          name: nexusflow-db
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: NEXUSFLOW_DISPATCH_TOPIC
        value: nexusflow.task.dispatch
      - key: NEXUSFLOW_LIFECYCLE_TOPIC
        value: nexusflow.workflow.events
      - key: NEXUSFLOW_WORKER_GROUP
        value: nexusflow-workers

  - type: worker
    name: nexusflow-relay
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: node dist/main.js
    # Shutdown grace for the bounded drain: the relay finishes its
    # in-flight publish cycle (at most one RELAY_PUBLISH_TIMEOUT_MS
    # publish plus DB overhead) before its shutdown hook returns.
    # Kill-safe regardless via claim expiry; 120s avoids relying on it.
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NEXUSFLOW_ROLE
        value: outbox-relay
      - key: NEXUSFLOW_TRANSPORT
        value: kafka
      - key: DATABASE_URL
        fromDatabase:
          name: nexusflow-db
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: NEXUSFLOW_DISPATCH_TOPIC
        value: nexusflow.task.dispatch
      - key: NEXUSFLOW_LIFECYCLE_TOPIC
        value: nexusflow.workflow.events
      - key: NEXUSFLOW_WORKER_GROUP
        value: nexusflow-workers

databases:
  # Free plan: 1 GB storage, expires 30 days after creation with a
  # 14-day upgrade grace period, no backups. See README "Render".
  - name: nexusflow-db
    plan: free
    databaseName: nexusflow
    user: nexusflow
